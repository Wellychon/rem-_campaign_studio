name: Auto Approve and Merge PR

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

permissions:
  pull-requests: write
  contents: write

jobs:
  auto-approve:
    runs-on: ubuntu-latest
    # Only auto-approve PRs opened by the repository owner
    if: github.actor == github.repository_owner
    steps:
      - name: Approve Pull Request
        # Requires the repo to allow Actions to create and approve pull requests
        # (Settings > Actions > General > Allow GitHub Actions to create and approve pull requests)
        # If branch protection requires reviews, a PAT stored in secrets.PAT may be needed instead.
        uses: hmarr/auto-approve-action@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  auto-merge:
    runs-on: ubuntu-latest
    needs: auto-approve
    if: github.actor == github.repository_owner
    steps:
      - name: Enable Auto Merge
        run: |
          gh pr merge "${{ github.event.pull_request.number }}" \
            --auto \
            --squash \
            --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
